apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource      ### HPA will be measure CPU Utilization to know when to scale 
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
